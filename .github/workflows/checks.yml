name: Harness checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit checks
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned compilers
        run: python3 tools/bootstrap.py
      - name: Compiler integration checks
        run: BSPHARNESS_INTEGRATION=1 python3 -m unittest discover -s tests -v
